name: Product captures
description: Capture a light/dark screenshot pair and compose matching README images.
inputs:
  config:
    description: Path to the repository-owned configuration.
    default: 'product-captures.json'
  dry-run:
    description: Validate the plan without product commands, browser capture, or publication.
    default: 'true'
  reuse-screenshots:
    description: Explicitly reuse the saved light and dark raw screenshots.
    default: 'false'
  url:
    description: Optional HTTP preview origin override.
    default: ''
  release-tag:
    description: Existing release tag that receives the finished image pair.
    default: ''
  update-pr:
    description: Open a review-only image update pull request.
    default: 'false'
outputs:
  artifact-path:
    description: Repository-relative generated output directory.
    value: ${{ steps.plan.outputs.artifact-path }}
runs:
  using: composite
  steps:
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Build capture tool
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../.."
        dotnet build ProductCaptures.csproj --configuration Release --nologo
    - name: Validate and plan captures
      id: plan
      shell: bash
      env:
        PRODUCT_CAPTURE_ACTION_REPOSITORY: ${{ github.action_repository }}
        PRODUCT_CAPTURE_ACTION_REF: ${{ github.action_ref }}
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_REUSE_SCREENSHOTS: ${{ inputs.reuse-screenshots }}
        CAPTURE_URL: ${{ inputs.url }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
      run: dotnet "$GITHUB_ACTION_PATH/../../bin/Release/net10.0/ProductCaptures.dll" action plan
    - name: Set up host runtime
      if: steps.plan.outputs.dry-run == 'false' && steps.plan.outputs.needs-node == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Install the capture browser
      if: steps.plan.outputs.dry-run == 'false'
      shell: bash
      run: dotnet "$GITHUB_ACTION_PATH/../../bin/Release/net10.0/ProductCaptures.dll" install --with-deps
    - name: Install the Obsidian display
      if: steps.plan.outputs.dry-run == 'false' && steps.plan.outputs.needs-obsidian == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes xvfb openbox
    - name: Capture and compose images
      if: steps.plan.outputs.dry-run == 'false'
      shell: bash
      env:
        PRODUCT_CAPTURE_ACTION_REPOSITORY: ${{ github.action_repository }}
        PRODUCT_CAPTURE_ACTION_REF: ${{ github.action_ref }}
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_REUSE_SCREENSHOTS: ${{ inputs.reuse-screenshots }}
        CAPTURE_URL: ${{ inputs.url }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
        NEEDS_OBSIDIAN: ${{ steps.plan.outputs.needs-obsidian }}
      run: |
        tool="$GITHUB_ACTION_PATH/../../bin/Release/net10.0/ProductCaptures.dll"
        if [[ "$RUNNER_OS" == Linux && "$NEEDS_OBSIDIAN" == true ]]; then
          xvfb-run --auto-servernum bash -s -- "$tool" <<'DISPLAY'
        openbox >/dev/null 2>&1 &
        window_manager=$!
        trap 'kill "$window_manager" 2>/dev/null || true' EXIT
        dotnet "$1" action run
        DISPLAY
        else
          dotnet "$tool" action run
        fi
    - name: Upload image previews
      if: steps.plan.outputs.dry-run == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: product-captures-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ steps.plan.outputs.artifact-path }}
        if-no-files-found: error
    - name: Attach images to the selected release
      if: steps.plan.outputs.dry-run == 'false' && inputs.release-tag != ''
      shell: bash
      env:
        PRODUCT_CAPTURE_ACTION_REPOSITORY: ${{ github.action_repository }}
        PRODUCT_CAPTURE_ACTION_REF: ${{ github.action_ref }}
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_REUSE_SCREENSHOTS: ${{ inputs.reuse-screenshots }}
        CAPTURE_URL: ${{ inputs.url }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
        GH_TOKEN: ${{ github.token }}
      run: dotnet "$GITHUB_ACTION_PATH/../../bin/Release/net10.0/ProductCaptures.dll" action release
    - name: Open an image update pull request
      if: steps.plan.outputs.dry-run == 'false' && inputs.update-pr == 'true'
      shell: bash
      env:
        PRODUCT_CAPTURE_ACTION_REPOSITORY: ${{ github.action_repository }}
        PRODUCT_CAPTURE_ACTION_REF: ${{ github.action_ref }}
        CAPTURE_CONFIG: ${{ inputs.config }}
        CAPTURE_DRY_RUN: ${{ inputs.dry-run }}
        CAPTURE_REUSE_SCREENSHOTS: ${{ inputs.reuse-screenshots }}
        CAPTURE_URL: ${{ inputs.url }}
        CAPTURE_RELEASE_TAG: ${{ inputs.release-tag }}
        CAPTURE_UPDATE_PR: ${{ inputs.update-pr }}
        GH_TOKEN: ${{ github.token }}
      run: dotnet "$GITHUB_ACTION_PATH/../../bin/Release/net10.0/ProductCaptures.dll" action pr

name: Verify toolkit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build toolkit
        run: dotnet build ProductCaptures.csproj --nologo
      - name: Install capture browser
        run: dotnet bin/Debug/net10.0/ProductCaptures.dll install --with-deps
      - name: Verify core contracts
        run: node --test test/core.test.mjs
      - name: Verify Obsidian launcher adapter
        run: node --test test/kiss-obsidian-launcher.test.mjs
      - name: Verify composition
        run: dotnet run --project test/CompositionTests.csproj
      - name: Verify host contracts
        run: dotnet run --project test/Hosts/Hosts.csproj
      - name: Capture generic fresh browser fixture
        env:
          SMOKE_ROOT: ${{ runner.temp }}/product-captures-smoke
        run: |
          mkdir -p "$SMOKE_ROOT"
          cp test/fixtures/generic/index.html test/fixtures/generic/product-captures.json "$SMOKE_ROOT/"
          dotnet bin/Debug/net10.0/ProductCaptures.dll --config "$SMOKE_ROOT/product-captures.json" --dry-run
          test ! -e "$SMOKE_ROOT/output"
          dotnet bin/Debug/net10.0/ProductCaptures.dll --config "$SMOKE_ROOT/product-captures.json"
          test "$(find "$SMOKE_ROOT/output" -type f -name '*.png' | wc -l)" -eq 4
          test -f "$SMOKE_ROOT/output/captures/overview-light.png"
          test -f "$SMOKE_ROOT/output/captures/overview-dark.png"
          test -f "$SMOKE_ROOT/output/hero.png"
          test -f "$SMOKE_ROOT/output/hero-dark.png"
      - uses: actions/upload-artifact@v4
        with:
          name: generic-smoke
          path: ${{ runner.temp }}/product-captures-smoke/output
          if-no-files-found: error
  same-revision-validation:
    uses: ./.github/workflows/validate.yml
    with:
      config: test/fixtures/generic/product-captures.json
  same-revision-capture:
    uses: ./.github/workflows/capture.yml
    with:
      config: test/fixtures/generic/product-captures.json
      dry-run: false

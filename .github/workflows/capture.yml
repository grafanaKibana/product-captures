name: Product captures
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: 'product-captures.json'
      dry-run:
        type: boolean
        default: true
      reuse-screenshots:
        type: boolean
        default: false
      url:
        type: string
        default: ''
      release-tag:
        type: string
        default: ''
      update-pr:
        type: boolean
        default: false
concurrency:
  group: product-captures-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out caller source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false
      - name: Capture caller product
        uses: $/actions/capture
        env:
          PRODUCT_CAPTURE_WORKFLOW_REVISION: ${{ job.workflow_sha }}
          PRODUCT_CAPTURE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        with:
          config: ${{ inputs.config }}
          dry-run: ${{ inputs.dry-run }}
          reuse-screenshots: ${{ inputs.reuse-screenshots }}
          url: ${{ inputs.url }}
          release-tag: ${{ inputs.release-tag }}
          update-pr: ${{ inputs.update-pr }}

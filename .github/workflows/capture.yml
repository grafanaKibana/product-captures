name: Product captures
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: product-captures.json
      dry-run:
        type: boolean
        default: true
      capture-mode:
        type: string
        default: fresh
      only:
        type: string
        default: ''
      template:
        type: string
        default: ''
      theme:
        type: string
        default: ''
      width:
        type: string
        default: ''
      height:
        type: string
        default: ''
      scale:
        type: string
        default: ''
      base-url:
        type: string
        default: ''
      output-dir:
        type: string
        default: ''
      skip-prepare:
        type: boolean
        default: false
      release-tag:
        type: string
        default: ''
      update-pr:
        type: boolean
        default: false
concurrency:
  group: product-captures-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out caller source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.release-tag && format('refs/tags/{0}', inputs.release-tag) || github.sha }}
          persist-credentials: false
      - name: Set up capture runtime
        if: ${{ !inputs.dry-run }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Capture caller product
        uses: $/actions/capture
        env:
          PRODUCT_CAPTURE_WORKFLOW_REVISION: ${{ job.workflow_sha }}
          PRODUCT_CAPTURE_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        with:
          config: ${{ inputs.config }}
          dry-run: ${{ inputs.dry-run }}
          capture-mode: ${{ inputs.capture-mode }}
          only: ${{ inputs.only }}
          template: ${{ inputs.template }}
          theme: ${{ inputs.theme }}
          width: ${{ inputs.width }}
          height: ${{ inputs.height }}
          scale: ${{ inputs.scale }}
          base-url: ${{ inputs.base-url }}
          output-dir: ${{ inputs.output-dir }}
          skip-prepare: ${{ inputs.skip-prepare }}
          release-tag: ${{ inputs.release-tag }}
          update-pr: ${{ inputs.update-pr }}
          token: ${{ github.token }}
